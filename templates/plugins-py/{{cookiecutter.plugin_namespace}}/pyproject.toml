[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.plugin_namespace}}"
version = "{{cookiecutter.plugin_version}}"
description = "Python delegated plugin for {{cookiecutter.project_name}}"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["plugin"]
