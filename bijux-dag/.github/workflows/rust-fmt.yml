name: Rust Format

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
          components: rustfmt
      - name: cargo fmt
        run: cargo run -p bijux-dev-dag --bin bijux-dev-dag -- fmt
