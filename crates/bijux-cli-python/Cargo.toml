[package]
name = "bijux-cli-python"
version = "0.3.0"
description = "Python bridge bindings for the Bijux command-line runtime."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "bijux_cli_python"
crate-type = ["rlib", "cdylib"]

[dependencies]
bijux-cli = { package = "bijux-cli", path = "../bijux-cli", version = "0.3.0" }
pyo3 = { version = "0.24.1", optional = true, default-features = false, features = ["extension-module", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[features]
default = []
python-extension = ["dep:pyo3"]
