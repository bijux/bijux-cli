[package]
name = "bijux-cli-python"
version.workspace = true
publish = false
description = "Python package and native bridge for installing and launching the Bijux command runtime."
edition.workspace = true
license.workspace = true
repository = "https://github.com/bijux/bijux-core"
homepage = "https://bijux.io/bijux-core/bijux-cli/"
documentation = "https://bijux.io/bijux-core/bijux-cli/"
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bijux", "python", "cli", "automation", "plugins"]
categories = ["api-bindings", "command-line-interface", "development-tools"]

[lib]
name = "bijux_cli_python"
crate-type = ["rlib", "cdylib"]

[dependencies]
bijux-cli.workspace = true
pyo3 = { version = "0.29.0", optional = true, default-features = false, features = ["abi3-py311", "extension-module", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[features]
default = []
python-extension = ["dep:pyo3"]
