[package]
name = "bijux-cli-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "bijux_cli_python"
crate-type = ["rlib", "cdylib"]

[dependencies]
bijux-cli-core = { path = "../bijux-cli-core" }
bijux-cli-routing = { path = "../bijux-cli-routing" }
bijux-cli-install = { path = "../bijux-cli-install" }
pyo3 = { version = "0.23.5", optional = true, default-features = false, features = ["extension-module"] }
serde_json = { workspace = true }

[lints]
workspace = true

[features]
default = []
python-extension = ["dep:pyo3"]
