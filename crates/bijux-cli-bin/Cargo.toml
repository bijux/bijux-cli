[package]
name = "bijux-cli-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "bijux-rs"
path = "src/main.rs"

[lib]
name = "bijux_cli_repl"
path = "src/lib.rs"

[dependencies]
bijux-cli-core = { path = "../bijux-cli-core", version = "0.1.0" }
bijux-cli-routing = { path = "../bijux-cli-routing", version = "0.1.0" }
bijux-cli-install = { path = "../bijux-cli-install", version = "0.1.0" }
bijux-cli-output = { path = "../bijux-cli-output", version = "0.1.0" }
serde_json = { workspace = true }
shlex = "1.3.0"
thiserror = { workspace = true }

[dev-dependencies]
bijux-cli-core = { path = "../bijux-cli-core", version = "0.1.0" }
bijux-cli-python = { path = "../bijux-cli-python", version = "0.1.0" }
libc = "0.2.177"

[lints]
workspace = true
