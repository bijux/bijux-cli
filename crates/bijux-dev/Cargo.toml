[package]
name = "bijux-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
readme = "README.md"
description = "Unified maintainer control plane and DAG governance tooling for the Bijux workspace."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bijux-cli.workspace = true
clap = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
toml.workspace = true
bijux-dag-core = { path = "../bijux-dag-core", version = "0.4.0" }
bijux-dag-artifacts = { path = "../bijux-dag-artifacts", version = "0.4.0" }
bijux-dag-runtime = { path = "../bijux-dag-runtime", version = "0.4.0" }
bijux-dag-app = { path = "../bijux-dag-app", version = "0.4.0" }

[dev-dependencies]
"bijux-dag-testkit" = { path = "../bijux-dag-testkit", version = "0.4.0" }

[lib]
name = "bijux_dev_cli"
path = "src/lib.rs"

[[bin]]
name = "bijux-dev-cli"
path = "src/bin/bijux-dev-cli.rs"

[[bin]]
name = "bijux-dev-dag"
path = "src/main.rs"

[[test]]
name = "architecture_layout_contracts"
path = "tests/maintainer/architecture/layout_contracts.rs"

[[test]]
name = "architecture_ownership_boundaries"
path = "tests/maintainer/architecture/ownership_boundaries.rs"

[[test]]
name = "architecture_depth_limit"
path = "tests/maintainer/architecture/depth_limit.rs"

[[test]]
name = "contracts_status_inventory_contracts"
path = "tests/maintainer/contracts/status_inventory_contracts.rs"

[[test]]
name = "contracts_suite_catalog_contracts"
path = "tests/maintainer/contracts/suite_catalog_contracts.rs"

[[test]]
name = "e2e_maintainer_routes"
path = "tests/maintainer/e2e/maintainer_routes.rs"

[[test]]
name = "e2e_contract_run_all"
path = "tests/maintainer/e2e/contract_run_all.rs"
