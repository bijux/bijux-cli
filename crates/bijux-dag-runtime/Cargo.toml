[package]
name = "bijux-dag-runtime"
version.workspace = true
description = "Execution engine, replay semantics, and runtime policy layer for Bijux DAG graphs."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://bijux.io/bijux-core/bijux-dag/"
documentation = "https://bijux.io/bijux-core/bijux-dag/packages/bijux-dag-runtime/"
rust-version.workspace = true
readme = "README.md"
keywords = ["bijux", "dag", "runtime", "execution", "replay"]
categories = ["command-line-interface", "development-tools", "filesystem"]

[lints]
workspace = true

[features]
default = []
experimental-public-api = ["bijux-dag-core/experimental-public-api"]

[dependencies]
"bijux-dag-core" = { path = "../bijux-dag-core", version = "0.4.0" }
"bijux-dag-artifacts" = { path = "../bijux-dag-artifacts", version = "0.4.0" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ctrlc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
