[package]
name = "bijux-dag-runtime"
version.workspace = true
description = "Execution engine, replay semantics, and runtime policy layer for Bijux DAG graphs."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://bijux.io/bijux-core/bijux-dag/"
documentation = "https://bijux.io/bijux-core/bijux-dag/packages/bijux-dag-runtime/"
rust-version.workspace = true
readme = "README.md"
keywords = ["bijux", "dag", "runtime", "execution", "replay"]
