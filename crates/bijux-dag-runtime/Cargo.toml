serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ctrlc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
bijux_dag_testkit = { package = "bijux-dag-testkit", path = "../bijux-dag-testkit", version = "0.4.0" }
