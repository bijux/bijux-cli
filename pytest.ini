[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src

norecursedirs =
  .venv
  .tox
  .pytest_cache
  .ruff_cache
  .mypy_cache
  .hypothesis
  .benchmarks
  build
  dist
  htmlcov
  docs
  artifacts

cache_dir = artifacts/test/.pytest_cache

asyncio_mode = auto
timeout = 300
timeout_method = thread
timeout_func_only = true

addopts =
  -ra
  --strict-markers
  --tb=short
  --cov=bijux_cli
  --cov-branch
  --cov-config=config/coveragerc.ini
  --cov-report=term-missing:skip-covered
  --cov-report=html
  --cov-fail-under=98
#  --hypothesis-show-statistics

xfail_strict = true

markers =
  slow: mark test as slow (deselect with '-m "not slow"')
  windows: mark tests for Windows-only

filterwarnings =
  ignore:Not saving anything, no benchmarks have been run!
  ignore:jsonschema\.exceptions\.RefResolutionError is deprecated:DeprecationWarning
  ignore:.*forkpty.*:DeprecationWarning
