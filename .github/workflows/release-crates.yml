name: Release Crates

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-crates-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-crates:
    name: publish-crates
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Plan crates release
        id: release
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: make gh-release-plan-crates

      - name: Set up Rust
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.publish == 'true' }}

      - name: Check crates.io credentials
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make gh-release-require-cargo-token

      - name: Publish crates.io packages
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish-rs RUST_PUBLISH_DRY_RUN=0 RUST_PUBLISH_PACKAGES="${{ steps.release.outputs.packages }}"
