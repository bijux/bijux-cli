name: Release Crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish-crates:
    name: publish-crates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for CI on tagged release commit
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          CI_WAIT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CI_WAIT_STARTED_AT
          make gh-release-wait-for-ci

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Plan crates release
        id: release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: make gh-release-plan-crates

      - name: Set up Rust
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.publish == 'true' }}

      - name: Check crates.io credentials
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make gh-release-require-cargo-token

      - name: Publish crates.io packages
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish-rs RUST_PUBLISH_DRY_RUN=0 RUST_PUBLISH_PACKAGES="${{ steps.release.outputs.packages }}"
