name: Bijux Standard Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  bijux_std:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run bijux standard checks
        run: make bijux-std-checks
