name: DAG Rust Format

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
          components: rustfmt
      - name: cargo fmt
        run: cargo run -p bijux-dev-dag --bin bijux-dev-dag -- fmt
