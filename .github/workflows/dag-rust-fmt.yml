name: DAG Rust Format

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: cargo fmt
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- fmt
