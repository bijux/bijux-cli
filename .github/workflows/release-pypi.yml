name: Release PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-pypi-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  publish-pypi:
    name: publish-pypi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Plan PyPI release
        id: release
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: make gh-release-plan-pypi

      - name: Set up Python
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - name: Set up Rust
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.publish == 'true' }}

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: make publish-py
