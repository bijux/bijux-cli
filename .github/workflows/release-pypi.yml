name: Release PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  publish-pypi:
    name: Publish PyPI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for CI to pass on the tagged commit
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          CI_WAIT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CI_WAIT_STARTED_AT
          make gh-release-wait-for-ci

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Decide whether to publish PyPI distributions
        id: release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: make gh-release-plan-pypi

      - name: Set up Python
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - name: Set up Rust
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.publish == 'true' }}

      - name: Publish PyPI distributions
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: make publish-py
