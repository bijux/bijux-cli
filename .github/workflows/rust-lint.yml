name: Rust Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
          components: clippy,rustfmt
      - name: checks
        run: cargo run -p bijux-dev-dag --bin bijux-dev-dag -- checks run --domain policy --domain quality --domain style --domain supply-chain --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: checks-report
          path: artifacts/reports
          if-no-files-found: warn
