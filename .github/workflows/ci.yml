name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  BIJUXCLI_API_GUARD: "1"

jobs:
  # 1) Test matrix (3.11, 3.12, 3.13) — parallel
  tests:
    name: tests (${{ matrix.toxenv }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            toxenv: "py311"
          - python-version: "3.12"
            toxenv: "py312"
          - python-version: "3.13"
            toxenv: "py313"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}
          cache: pip
          cache-dependency-path: |
            crates/bijux-cli-python/pyproject.toml
            requirements/**/*.txt

      - run: python -m pip install -U pip tox
      - run: tox -vv -e ${{ matrix.toxenv }}

      # Evidence collection (per-Python)
      - name: Stage test artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/test_upload && mkdir -p artifacts/test_upload

          if [ -d artifacts/test ]; then
            find artifacts/test -type f \
              \( -name 'junit*.xml' -o -name 'pytest*.xml' -o -name 'report.xml' -o -name 'coverage.xml' \) \
              -not -path 'artifacts/test/tmp/*' \
              -print -exec cp --parents -t artifacts/test_upload {} +
            if [ -d artifacts/test/htmlcov ]; then
              mkdir -p artifacts/test_upload/htmlcov
              cp -r artifacts/test/htmlcov/. artifacts/test_upload/htmlcov/
            fi
          fi

          if [ -d .tox ]; then
            find .tox -type f \
              \( -name 'junit*.xml' -o -name 'pytest*.xml' -o -name 'report.xml' -o -name 'coverage.xml' \) \
              -print -exec cp --parents -t artifacts/test_upload {} + || true
          fi

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.toxenv }}
          path: artifacts/test_upload/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage (direct)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.toxenv }}
          path: artifacts/test/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # 2) Non-lint checks — parallel; pinned to 3.11
  checks:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [quality, security, docs, build, sbom]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            crates/bijux-cli-python/pyproject.toml
            requirements/**/*.txt

      - run: python -m pip install -U pip tox
      - name: Validate cross-ecosystem package metadata
        run: |
          cargo run -q -p bijux-cli-bin -- dev cli scripts package-metadata --format json --no-pretty > /tmp/package-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/package-metadata.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if payload.get("status") == "pass" else 1)
          PY
      - run: tox -vv -e ${{ matrix.env }}

      # --- QUALITY ---
      - name: Upload quality artifacts
        if: ${{ always() && matrix.env == 'quality' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: artifacts/quality/**
          if-no-files-found: warn
          retention-days: 14

      # --- SECURITY ---
      - name: Upload security artifacts
        if: ${{ always() && matrix.env == 'security' }}
        uses: actions/upload-artifact@v4
        with:
          name: security
          path: artifacts/security/**
          if-no-files-found: warn
          retention-days: 14

      # --- DOCS (source + site produced by make docs) ---
      - name: Upload docs artifacts
        if: ${{ always() && matrix.env == 'docs' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: artifacts/docs/**
          if-no-files-found: warn
          retention-days: 14

      # --- DIST from the 'build' env (artifacts/build) ---
      - name: Validate artifacts/build on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.env == 'build' }}
        shell: bash
        run: |
          test -d artifacts/build && compgen -G "artifacts/build/*" >/dev/null \
            || { echo "::error::artifacts/build is missing or empty"; exit 1; }

      - name: Upload dist artifacts
        if: ${{ matrix.env == 'build' && hashFiles('artifacts/build/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: artifacts/build/**
          if-no-files-found: error
          retention-days: 14

      # --- Evidence (optional, for releases) ---
      - name: Upload evidence
        if: ${{ matrix.env == 'build' && hashFiles('artifacts/evidence/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/evidence/**
          if-no-files-found: ignore
          retention-days: 30

      # --- SBOM ---
      - name: Upload SBOM
        if: ${{ matrix.env == 'sbom' && hashFiles('artifacts/sbom/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/**
          if-no-files-found: ignore
          retention-days: 30

  rust-parity:
    name: rust-parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-vs-Python parity baseline gate
        run: |
          python3 scripts/parity/run_rust_python_parity.py --enforce-baseline

      - name: Command-tree drift gate
        run: |
          cargo test -p bijux-cli --test routing command_tree_

      - name: Schema drift gate
        run: |
          cargo test -p bijux-cli --test routing schema_snapshots::

      - name: Generate current Rust state artifact
        run: |
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-CRATE-BOUNDARY-METRICS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-PUBLIC-API-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-CURRENT-RUST-STATE
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-TEST-QUALITY-AUDIT
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-TEST-DOMAIN-VALUE-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-DEEP-TEST-QUALITY-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-DEEP-LAYER-TEST-COVERAGE-REPORTS
          cargo run -q -p bijux-cli-bin -- dev cli scripts generate --id GEN-STATUS-FLAKY-TEST-LABELS --json --no-pretty > artifacts/status/flaky_generator_run.json
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-PLUGIN-STATE-REPORT
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-TRUTH-STATUS-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-STATUS-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-REPL-BEHAVIOR-REPORTS
          cargo run -q -p bijux-cli --bin bijux -- dev cli scripts status run --id STATUS-CONTRACT-GENERATE-PARSER-ABUSE-REPORT
