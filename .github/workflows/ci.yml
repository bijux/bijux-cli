            artifacts/status/what_is_intentionally_different.json
            artifacts/status/what_is_unproven.json
            artifacts/status/next_200_todos.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload status report bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: |
            artifacts/status/status*.json
            artifacts/status/repl_only_behaviors.json
