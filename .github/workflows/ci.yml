              "dev cli parity",
              "dev cli route-audit",
              "dev cli state-audit",
              "dev cli script-audit",
              "dev cli crate-health",
              "dev cli package-health",
              "dev cli docs-audit",
          ]
          out = {}
          for command in commands:
              args = command.split()
              j = subprocess.run(["cargo", "run", "-q", "-p", "bijux-cli-bin", "--", *args, "--format", "json", "--no-pretty"], check=True, capture_output=True, text=True)
              t = subprocess.run(["cargo", "run", "-q", "-p", "bijux-cli-bin", "--", *args, "--format", "text"], check=True, capture_output=True, text=True)
              parsed = json.loads(j.stdout or "{}")
              out[command] = {
                  "json": parsed,
                  "json_top_level_keys": sorted(parsed.keys()) if isinstance(parsed, dict) else [],
                  "text": t.stdout,
              }
          (root / "dev_cli_control_plane_samples.json").write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
