name: "continuous integration"
on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PYTHONUNBUFFERED: 1
  BIJUXCLI_API_GUARD: 1
  RUST_TOOLCHAIN_VERSION: 1.86.0
jobs:
  fmt:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml
      - name: "Set up Rust"
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN_VERSION }}"
          components: rustfmt
      - name: "Restore the Rust cache"
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: "Run repository formatting gate"
        run: "make fmt"
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml
      - name: "Set up Rust"
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN_VERSION }}"
          components: clippy
      - name: "Restore the Rust cache"
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: "Run repository lint gate"
        run: "make lint"
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
  audit:
    name: "dependency audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml
      - name: "Set up Rust"
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN_VERSION }}"
      - name: "Restore the Rust cache"
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: "Install Rust security tools"
        run: "make gh-security-install-rust-tools"
      - name: "Run repository audit gate"
        run: "make audit"
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml
      - name: "Set up Rust"
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "${{ env.RUST_TOOLCHAIN_VERSION }}"
      - name: "Restore the Rust cache"
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: "Install cargo-nextest"
        run: "make gh-test-install-rust-tools"
      - name: "Run repository test gate"
        run: "make test"
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
