            artifacts/parity/repl_cli_output_diff.json
            artifacts/parity/stdout_diff.md
            artifacts/parity/stderr_diff.md
            artifacts/parity/exit_code_diff.md
            artifacts/parity/help_diff.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload state parity artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: state-parity
          path: |
            artifacts/parity/config_parity_report.json
            artifacts/parity/history_parity_report.json
            artifacts/parity/memory_parity_report.json
            artifacts/status/state_doctor_report.json
            artifacts/status/state_doctor_report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload milestone truth status artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: milestone-truth-status
          path: |
            artifacts/status/what_is_done.json
            artifacts/status/what_is_left.json
            artifacts/status/what_is_partial.json
