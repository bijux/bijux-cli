name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  BIJUXCLI_API_GUARD: "1"

jobs:
  # 1) Test matrix (3.11, 3.12, 3.13) — parallel
  tests:
    name: tests (${{ matrix.toxenv }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            toxenv: "py311"
          - python-version: "3.12"
            toxenv: "py312"
          - python-version: "3.13"
            toxenv: "py313"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix['python-version'] }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/**/*.txt

      - run: python -m pip install -U pip tox
      - run: tox -vv -e ${{ matrix.toxenv }}

      # Evidence collection (per-Python)
      - name: Stage test artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/test_upload && mkdir -p artifacts/test_upload

          if [ -d artifacts/test ]; then
            find artifacts/test -type f \
              \( -name 'junit*.xml' -o -name 'pytest*.xml' -o -name 'report.xml' -o -name 'coverage.xml' \) \
              -not -path 'artifacts/test/tmp/*' \
              -print -exec cp --parents -t artifacts/test_upload {} +
            if [ -d artifacts/test/htmlcov ]; then
              mkdir -p artifacts/test_upload/htmlcov
              cp -r artifacts/test/htmlcov/. artifacts/test_upload/htmlcov/
            fi
          fi

          if [ -d .tox ]; then
            find .tox -type f \
              \( -name 'junit*.xml' -o -name 'pytest*.xml' -o -name 'report.xml' -o -name 'coverage.xml' \) \
              -print -exec cp --parents -t artifacts/test_upload {} + || true
          fi

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.toxenv }}
          path: artifacts/test_upload/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage (direct)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.toxenv }}
          path: artifacts/test/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # 2) Non-lint checks — parallel; pinned to 3.11
  checks:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [quality, security, docs, build, api, sbom, citation]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/**/*.txt

      # Tooling only where needed
      - uses: actions/setup-node@v4
        if: ${{ matrix.env == 'api' }}
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        if: ${{ matrix.env == 'api' }}
        with:
          distribution: "temurin"
          java-version: "17"

      - run: python -m pip install -U pip tox
      - name: Validate cross-ecosystem package metadata
        run: python scripts/check-package-metadata.py
      - run: tox -vv -e ${{ matrix.env }}

      # --- QUALITY ---
      - name: Upload quality artifacts
        if: ${{ always() && matrix.env == 'quality' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: artifacts/quality/**
          if-no-files-found: warn
          retention-days: 14

      # --- SECURITY ---
      - name: Upload security artifacts
        if: ${{ always() && matrix.env == 'security' }}
        uses: actions/upload-artifact@v4
        with:
          name: security
          path: artifacts/security/**
          if-no-files-found: warn
          retention-days: 14

      # --- DOCS (source + site produced by make docs) ---
      - name: Upload docs artifacts
        if: ${{ always() && matrix.env == 'docs' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: artifacts/docs/**
          if-no-files-found: warn
          retention-days: 14

      # --- DIST from the 'build' env (artifacts/build) ---
      - name: Validate artifacts/build on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.env == 'build' }}
        shell: bash
        run: |
          test -d artifacts/build && compgen -G "artifacts/build/*" >/dev/null \
            || { echo "::error::artifacts/build is missing or empty"; exit 1; }

      - name: Upload dist artifacts
        if: ${{ matrix.env == 'build' && hashFiles('artifacts/build/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: artifacts/build/**
          if-no-files-found: error
          retention-days: 14

      # --- Evidence (optional, for releases) ---
      - name: Upload evidence
        if: ${{ matrix.env == 'build' && hashFiles('artifacts/evidence/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/evidence/**
          if-no-files-found: ignore
          retention-days: 30

      # --- SBOM ---
      - name: Upload SBOM
        if: ${{ matrix.env == 'sbom' && hashFiles('artifacts/sbom/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/**
          if-no-files-found: ignore
          retention-days: 30

      # --- Citation ---
      - name: Upload citation
        if: ${{ matrix.env == 'citation' && hashFiles('artifacts/citation/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: citation
          path: artifacts/citation/**
          if-no-files-found: ignore
          retention-days: 14

      # --- API (full logs) ---
      - name: Upload API artifacts (full)
        if: ${{ always() && matrix.env == 'api' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-full
          path: artifacts/api/**
          if-no-files-found: warn
          retention-days: 14

      # --- API schema (release layout expected by 'Publish to PyPI' / Releases) ---
      - name: Stage API schema (exact release layout)
        if: ${{ matrix.env == 'api' && hashFiles('artifacts/api/v1/schema.yaml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _release_api && mkdir -p _release_api/v1
          cp -f artifacts/api/v1/schema.yaml _release_api/v1/schema.yaml

      - name: Upload API schema (release layout)
        if: ${{ matrix.env == 'api' && hashFiles('artifacts/api/v1/schema.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: _release_api/v1
          if-no-files-found: error
          retention-days: 14

  rust-parity:
    name: rust-parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-vs-Python parity baseline gate
        run: |
          python3 scripts/parity/run_rust_python_parity.py --enforce-baseline

      - name: Command-tree drift gate
        run: |
          cargo test -p bijux-cli-routing --test command_tree_snapshot --test command_tree_diff_report

      - name: Schema drift gate
        run: |
          cargo test -p bijux-cli-contracts --test schema_snapshots

      - name: Generate current Rust state artifact
        run: |
          python3 scripts/status/generate_crate_boundary_metrics.py
          python3 scripts/status/generate_public_api_reports.py
          python3 scripts/status/generate_current_rust_state.py
          python3 scripts/status/generate_test_quality_audit.py
          python3 scripts/status/generate_flaky_test_labels.py
          python3 scripts/status/generate_plugin_state_report.py
          python3 scripts/status/generate_truth_milestone_status.py
          python3 scripts/status/generate_status_reports.py
          python3 scripts/status/generate_repl_behavior_reports.py
          python3 scripts/status/generate_parser_abuse_report.py
          python3 scripts/status/generate_namespace_reservation_reports.py
          python3 scripts/status/generate_plugin_lifecycle_failure_reports.py
          python3 scripts/status/generate_config_corruption_reports.py
          python3 scripts/status/generate_state_resilience_reports.py
          python3 scripts/status/generate_repl_recovery_reports.py
          python3 scripts/status/generate_docs_duplication_report.py
          python3 scripts/status/generate_install_truth_reports.py
          python3 scripts/status/generate_packaging_ambiguity_reports.py
          python3 scripts/status/generate_performance_reports.py
          python3 scripts/status/generate_release_evidence_reports.py
          python3 scripts/status/generate_release_build_reports.py
          python3 scripts/status/generate_migration_notes.py
          python3 scripts/status/generate_next_phase_priorities.py
          python3 scripts/status/generate_cleanup_reports.py
          python3 scripts/status/generate_product_mount_readiness_reports.py
          python3 scripts/status/generate_plugin_scaffold_reports.py
          python3 scripts/status/generate_compatibility_shim_reports.py
          python3 scripts/status/generate_route_law_reports.py
          python3 scripts/status/generate_state_law_reports.py
          python3 scripts/status/generate_diagnostics_law_reports.py
          cargo run -q -p bijux-cli-bin -- dev cli inventory --json --no-pretty > artifacts/status/dev_cli_inventory.json
          cargo run -q -p bijux-cli-bin -- dev cli docs-audit --json --no-pretty > artifacts/status/docs_audit.json
          cargo run -q -p bijux-cli-bin -- dev cli plugin-health --json --no-pretty > artifacts/status/plugin_health_report.json
          cargo run -q -p bijux-cli-bin -- dev cli plugin-health --text > artifacts/status/plugin_health_report.txt
          cargo run -q -p bijux-cli-bin -- dev cli crate-health --json --no-pretty > artifacts/status/duplication_hotspots.json
          cargo run -q -p bijux-cli-bin -- dev cli state-audit --json --no-pretty > artifacts/status/state_audit_report.json
          cargo run -q -p bijux-cli-bin -- dev cli state-doctor --json --no-pretty > artifacts/status/state_doctor_report.json
          cargo run -q -p bijux-cli-bin -- dev cli state-doctor --text > artifacts/status/state_doctor_report.txt
          cargo run -q -p bijux-cli-bin -- dev cli script-audit --json --no-pretty > artifacts/status/script_only_behaviors.json
          cargo run -q -p bijux-cli-bin -- dev cli script-audit --text > artifacts/status/task_runner_only_behaviors.txt

      - name: Warn on new script files without justification
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD~1)"
          fi
          mapfile -t added < <(git diff --name-status "$BASE_SHA"...HEAD -- scripts | awk '$1=="A"{print $2}')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No new script files added."
            exit 0
          fi
          allowlist=".github/script_additions_allowlist.txt"
          missing=0
          for path in "${added[@]}"; do
            if ! grep -Eq "^[[:space:]]*${path//\//\\/}[[:space:]]*#" "$allowlist"; then
              echo "NEW SCRIPT WARNING: add justification to $allowlist for $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Runtime unity gate
        run: |
          python3 scripts/status/check_runtime_unity.py --enforce

      - name: Binary-vs-bridge parity artifact
        run: |
          python3 scripts/parity/generate_binary_bridge_parity.py

      - name: Command parity matrix artifact
        run: |
          python3 scripts/parity/generate_command_parity_matrix.py

      - name: Command parity regression gate
        run: |
          python3 scripts/parity/check_command_parity_gates.py --enforce

      - name: Release truth gate
        run: |
          python3 scripts/status/enforce_release_truth_gates.py --enforce

      - name: Deterministic generation gate
        run: |
          python3 scripts/status/check_deterministic_generation.py

      - name: Release build consistency gate
        run: |
          python3 scripts/status/check_release_build_consistency.py

      - name: Test quality policy gate
        run: |
          python3 scripts/status/enforce_test_quality_gates.py

      - name: Performance regression gate
        run: |
          python3 scripts/status/enforce_performance_regression_gates.py

      - name: Next-phase evidence gate
        run: |
          python3 scripts/status/enforce_next_phase_evidence.py

      - name: Compatibility shim policy gate
        run: |
          python3 scripts/status/enforce_compatibility_shim_policy.py

      - name: Route law policy gate
        run: |
          python3 scripts/status/enforce_route_law_policy.py

      - name: Public API policy gate
        run: |
          python3 scripts/status/enforce_public_api_policy.py

      - name: State law policy gate
        run: |
          python3 scripts/status/enforce_state_law_policy.py

      - name: Diagnostics law policy gate
        run: |
          python3 scripts/status/enforce_diagnostics_law_policy.py

      - name: Plugin scaffold policy gate
        run: |
          python3 scripts/status/enforce_plugin_scaffold_policy.py

      - name: Maintainer automation policy gate
        run: |
          python3 scripts/status/enforce_dev_cli_automation_policy.py

      - name: New public API consumer warning
        run: |
          python3 scripts/status/warn_new_unused_public_api.py

      - name: Status report freshness gate
        run: |
          python3 scripts/status/check_status_reports_stale.py

      - name: Upload parity report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-python-parity
          path: artifacts/parity/rust_python_parity_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload current Rust state artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: current-rust-state
          path: artifacts/status/current_rust_state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload crate boundary artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crate-boundary
          path: |
            artifacts/status/crate_boundary_metrics.json
            artifacts/status/crate_boundary_report.json
            artifacts/status/public_api_by_crate.json
            artifacts/status/internal_only_candidates_by_crate.json
            artifacts/status/cross_crate_api_usage.json
            artifacts/status/public_api_churn.json
            artifacts/status/public_api_actually_used.json
            artifacts/status/public_api_candidates_for_private.json
            artifacts/status/duplication_hotspots.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dev-cli inventory artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-cli-inventory
          path: artifacts/status/dev_cli_inventory.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload docs audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit
          path: |
            artifacts/status/docs_audit.json
            artifacts/status/docs_duplication_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test quality audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-quality-audit
          path: |
            artifacts/status/test_quality_audit.json
            artifacts/status/top_20_weakest_tests.json
            artifacts/status/top_20_missing_failure_cases.json
            artifacts/status/top_20_missing_parity_cases.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload flaky test label artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-labels
          path: artifacts/status/flaky_tests.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload plugin state artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-state
          path: |
            artifacts/status/plugin_state_report.json
            artifacts/status/plugin_health_report.json
            artifacts/status/plugin_health_report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime unity report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-unity
          path: |
            artifacts/status/runtime_unity_report.json
            artifacts/status/install_source_diagnostics.json
            artifacts/status/ambiguous_runtime_diagnostics.json
            artifacts/status/install_health_report.json
            artifacts/status/install_health_report.txt
            artifacts/status/remaining_install_ambiguities.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload binary-vs-python-bridge parity report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-bridge-parity
          path: artifacts/parity/binary_vs_python_bridge_parity_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload command parity matrix artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: command-parity-matrix
          path: |
            artifacts/parity/command_parity_matrix.json
            artifacts/parity/plugin_parity_matrix.json
            artifacts/parity/repl_parity_matrix.json
            artifacts/parity/python_bridge_parity_matrix.json
