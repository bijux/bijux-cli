name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  BIJUXCLI_API_GUARD: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Python toolchain
        run: make install

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Python formatting
        run: |
          artifacts/python/.venv/bin/ruff format --check \
            --config configs/python/ruff.toml \
            crates/bijux-cli-python/python/bijux_cli_py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Python toolchain
        run: make install

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint Python
        run: |
          artifacts/python/.venv/bin/ruff check \
            --select E,F,I,UP,B,SIM,C4,TID,PERF \
            --ignore E501 \
            --config configs/python/ruff.toml \
            crates/bijux-cli-python/python/bijux_cli_py

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Install Python toolchain
        run: make install

      - name: Audit Rust dependencies
        run: cargo deny check --config configs/rust/deny.toml

      - name: Scan Rust advisories
        run: cargo audit

      - name: Scan Python code
        run: |
          artifacts/python/.venv/bin/bandit \
            -r crates/bijux-cli-python/python/bijux_cli_py \
            -ll

      - name: Audit Python dependencies
        run: |
          artifacts/python/.venv/bin/pip-audit \
            --progress-spinner off \
            --ignore-vuln PYSEC-2022-42969

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python toolchain
        run: make install

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Python tests
        run: make test-py
