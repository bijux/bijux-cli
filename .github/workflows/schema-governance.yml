name: Schema Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: generate schema changelog
        run: ./scripts/generate_schema_changelog.sh
      - name: verify changelog is committed
        run: git diff --exit-code docs/reports/foundation/schema_changelog.md
      - name: schema governance contract tests
        run: cargo test -p bijux-dev-dag --test schema_governance_contracts
      - name: upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: schema-governance-report
          path: docs/reports/foundation/schema_changelog.md
          if-no-files-found: error
