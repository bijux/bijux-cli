name: Release GitHub

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-github-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  RUST_TOOLCHAIN_VERSION: "1.86.0"
  MATURIN_VERSION: "v1.12.6"

jobs:
  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Wait for CI to pass on the tagged commit
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF_NAME: ${{ github.ref_name }}
        run: |
          CI_WAIT_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CI_WAIT_STARTED_AT
          make gh-release-wait-for-ci

      - name: Decide whether to publish a GitHub Release
        id: release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: make gh-release-plan-github

      - name: Set up Python
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crates/bijux-cli-python/pyproject.toml

      - name: Set up Rust
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: ${{ steps.release.outputs.publish == 'true' }}

      - name: Prepare release tree
        if: ${{ steps.release.outputs.publish == 'true' }}
        id: release_tree
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_tree="${GITHUB_WORKSPACE}/artifacts/release-tree"
          release_assets="${GITHUB_WORKSPACE}/artifacts/github-release"
          rm -rf "${release_tree}" "${release_assets}"
          python3 .github/scripts/prepare_release_tree.py \
            --workspace-root . \
            --output-dir "${release_tree}" \
            --version "${RELEASE_VERSION}" >/dev/null
          mkdir -p "${release_assets}"
          echo "path=${release_tree}" >> "${GITHUB_OUTPUT}"
          echo "assets=${release_assets}" >> "${GITHUB_OUTPUT}"

      - name: Build manylinux wheel
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          working-directory: ${{ steps.release_tree.outputs.path }}
          manylinux: "2014"
          command: build
          args: >-
            --release
            --locked
            --manifest-path crates/bijux-cli-python/Cargo.toml
            --interpreter python3.11
            --compatibility pypi
            --out ${{ steps.release_tree.outputs.assets }}

      - name: Build source distribution
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          working-directory: ${{ steps.release_tree.outputs.path }}
          command: sdist
          args: >-
            --manifest-path crates/bijux-cli-python/Cargo.toml
            --out ${{ steps.release_tree.outputs.assets }}

      - name: Generate release notes and checksums
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ steps.release_tree.outputs.assets }}
        run: |
          set -euo pipefail
          cd "${RELEASE_ASSETS_DIR}"
          shasum -a 256 ./* > sha256sums.txt
          cat > release-notes.md <<EOF
          Repository releases mirror the stamped tag artifacts for this version.

          Release version: ${RELEASE_VERSION}
          Tag: ${RELEASE_TAG}

          Published package surfaces:
          - crates.io: https://crates.io/crates/bijux-cli/${RELEASE_VERSION}
          - PyPI: https://pypi.org/project/bijux-cli/${RELEASE_VERSION}/
          - GHCR: https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY#*/}%2Fbijux-cli

          Attached assets:
          - manylinux wheel for the Python package
          - source distribution for the Python package
          - SHA-256 checksums for the attached files
          EOF

      - name: Install ORAS
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Log in to GHCR
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish bijux-cli release bundle to GHCR
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ steps.release_tree.outputs.assets }}
        run: |
          set -euo pipefail
          archive_dir="${GITHUB_WORKSPACE}/artifacts/ghcr"
          archive_name="bijux-cli-${RELEASE_TAG}.tar.gz"
          archive_path="${archive_dir}/${archive_name}"
          package_ref="ghcr.io/${GITHUB_REPOSITORY}/bijux-cli"
          mkdir -p "${archive_dir}"
          tar -C "${RELEASE_ASSETS_DIR}" -czf "${archive_path}" .
          cd "${archive_dir}"
          oras push "${package_ref}:${RELEASE_TAG}" \
            --artifact-type application/vnd.bijux.release-bundle.v1+tar \
            --annotation "org.opencontainers.image.title=bijux-cli" \
            --annotation "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "./${archive_name}:application/gzip"
          oras tag "${package_ref}:${RELEASE_TAG}" latest

      - name: Publish GitHub Release
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release_tree.outputs.assets }}/release-notes.md
          files: |
            ${{ steps.release_tree.outputs.assets }}/*.whl
            ${{ steps.release_tree.outputs.assets }}/*.tar.gz
            ${{ steps.release_tree.outputs.assets }}/sha256sums.txt
          fail_on_unmatched_files: true
          preserve_order: true
