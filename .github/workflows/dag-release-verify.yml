name: DAG Release Verify

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: verify release evidence set
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- verify evidence-release-set
      - name: generate release proof reports
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- repo release-evidence-report
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-report
          path: artifacts/reports
          if-no-files-found: warn
