name: DAG Rust Lint

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt
      - name: checks
        continue-on-error: true
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- checks run --domain policy --domain quality --domain style --domain supply-chain --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: checks-report
          path: artifacts/reports
          if-no-files-found: warn
