name: Ecosystem Contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ecosystem-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: ecosystem contract tests
        run: cargo test -p bijux-dev-dag --test ecosystem_contracts
