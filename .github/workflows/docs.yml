name: Deploy Docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ENABLE_SOCIAL_CARDS: "true"

    steps:
      - name: Checkout (full history for revision-date plugin)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            crates/bijux-cli-python/pyproject.toml
            mkdocs.yml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install documentation toolchain
        run: make gh-docs-install

      - name: Export release tag
        run: make gh-docs-export-release-tag

      - name: Generate artifact summary pages
        run: make docs-artifact-pages

      - name: Check generated artifact pages
        run: make docs-artifact-pages-check

      - name: Check docs (make docs-check)
        run: make docs-check

      - name: Configure Git author
        run: make gh-docs-configure-git

      - name: Deploy docs (make docs-deploy)
        run: make docs-deploy
