name: Evidence Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: verify evidence foundation
        run: cargo run -p bijux-dev-dag -- verify evidence-foundation --report artifacts/reports/evidence-foundation.json
      - name: run battle-first trust subset
        run: |
          cargo run -p bijux-dev-dag -- verify evidence-battle --report artifacts/reports/evidence-battle.json
          cargo run -p bijux-dev-dag -- verify evidence-cache --report artifacts/reports/evidence-cache.json
          cargo run -p bijux-dev-dag -- verify evidence-replay --report artifacts/reports/evidence-replay.json
          cargo run -p bijux-dev-dag -- verify evidence-consumers --report artifacts/reports/evidence-consumers.json
      - name: verify release evidence set
        run: cargo run -p bijux-dev-dag -- verify evidence-release-set --report artifacts/reports/evidence-release-set.json
      - name: run release-first trust subset
        run: |
          cargo run -p bijux-dev-dag -- verify evidence-release-set --report artifacts/reports/release-subset-release-set.json
          cargo run -p bijux-dev-dag -- verify evidence-foundation --report artifacts/reports/release-subset-foundation.json
          cargo run -p bijux-dev-dag -- repo release-evidence-report --report artifacts/reports/release-subset-evidence-report.json
      - name: generate evidence summary reports
        run: cargo run -p bijux-dev-dag -- repo evidence-summary-report --report artifacts/reports/evidence-summary.json
      - name: generate scheduler profile report from runtime fixtures
        run: |
          cargo run -p bijux-dev-dag --bin generate_scheduler_profile_report
          git diff --exit-code docs/reports/foundation/scheduler_profile_report.json
      - name: generate runtime adapter and backend scope reports
        run: |
          cargo run -p bijux-dev-dag --bin generate_runtime_adapter_scope_reports
          git diff --exit-code \
            docs/reports/foundation/runtime_adapter_surface_inventory.md \
            docs/reports/foundation/backend_capability_matrix.md \
            docs/reports/foundation/backend_support_matrix.md \
            docs/reports/foundation/unsupported_capability_approximations_report.md \
            docs/reports/foundation/implemented_backend_surfaces_report.md \
            docs/reports/foundation/simulated_backend_surfaces_report.md
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verify-reports
          path: artifacts/reports
          if-no-files-found: warn
