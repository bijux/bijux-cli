name: Package Dry Run

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: package dry run
        run: |
          cargo package -p bijux-dag-core --allow-dirty --no-verify
          cargo package -p bijux-dag-artifacts --allow-dirty --no-verify
          cargo package -p bijux-dag-runtime --allow-dirty --no-verify
          cargo package -p bijux-dag-app --allow-dirty --no-verify
          cargo package -p bijux-dag-cli --allow-dirty --no-verify
          cargo package -p bijux-dev-dag --allow-dirty --no-verify
