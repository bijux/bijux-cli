name: DAG Rust Test

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain # v1@stable
        with:
          toolchain: 1.85.0
      - name: run architecture tests
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- tests run --domain governance --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: artifacts/reports
          if-no-files-found: warn
