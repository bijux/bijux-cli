name: DAG Compatibility Fixture Drift

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "bijux-dag/**"
      - "makes/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "bijux-dag/**"
      - "makes/dag/**"
      - ".github/workflows/dag-*"

jobs:
  compat-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: check compatibility fixtures
        run: cargo run -p bijux-dev-dag --bin bijux-dev-dag -- contracts run --domain compat --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-fixture-report
          path: artifacts/reports
          if-no-files-found: warn
