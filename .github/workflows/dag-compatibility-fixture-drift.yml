name: DAG Compatibility Fixture Drift

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"

jobs:
  compat-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: check compatibility fixtures
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- contracts run --domain compat --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-fixture-report
          path: artifacts/reports
          if-no-files-found: warn
