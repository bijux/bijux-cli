name: DAG Schema Governance

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  schema-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: generate schema changelog
        run: cargo run -p bijux-core-dev --bin bijux-dev-dag -- repo schema-changelog
      - name: verify changelog is committed
        run: git diff --exit-code docs/reports/foundation/SCHEMA_CHANGELOG.md
      - name: schema governance contract tests
        run: cargo test -p bijux-core-dev --test evidence_schema_contracts
      - name: upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: schema-governance-report
          path: docs/reports/foundation/SCHEMA_CHANGELOG.md
          if-no-files-found: error
