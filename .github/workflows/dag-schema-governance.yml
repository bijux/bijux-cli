name: DAG Schema Governance

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  schema-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: generate schema changelog
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- repo schema-changelog
      - name: verify changelog is committed
        run: git diff --exit-code docs/reports/foundation/SCHEMA_CHANGELOG.md
      - name: schema governance contract tests
        run: cargo test -p bijux-dev --test evidence_schema_contracts
      - name: upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: schema-governance-report
          path: docs/reports/foundation/SCHEMA_CHANGELOG.md
          if-no-files-found: error
