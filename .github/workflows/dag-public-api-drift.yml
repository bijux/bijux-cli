name: DAG Public API Drift

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: check public API
        continue-on-error: true
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- api public-surface
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: public-api-report
          path: artifacts/reports
          if-no-files-found: warn
