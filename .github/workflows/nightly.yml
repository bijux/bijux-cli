name: Nightly Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  night:
    name: night
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/**/*.txt

      - run: python -m pip install -U pip tox
      - run: tox -vv -e night

      - name: Upload night artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: night
          path: artifacts/test/**
          if-no-files-found: warn
          retention-days: 7
