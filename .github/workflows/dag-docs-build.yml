name: DAG Docs Build

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain # v1@stable
        with:
          toolchain: 1.85.0
      - name: rustdoc workspace
        run: cargo doc --workspace --no-deps
      - name: docs policy checks
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- docs run --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: docs-report
          path: artifacts/reports
          if-no-files-found: warn
