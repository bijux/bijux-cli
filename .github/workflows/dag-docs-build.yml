name: DAG Docs Build

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev-dag/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: rustdoc workspace
        run: cargo doc --workspace --no-deps
      - name: docs policy checks
        run: cargo run -p bijux-dev-dag --bin bijux-dev-dag -- docs run --advisory
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: docs-report
          path: artifacts/reports
          if-no-files-found: warn
