name: DAG Dependency Audit

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: install audit
        run: cargo install cargo-audit --locked
      - name: run audit
        run: cargo run -p bijux-core-dev --bin bijux-dev-dag -- security
      - name: upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: artifacts/reports
          if-no-files-found: warn
