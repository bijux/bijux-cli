name: DAG Coverage Reports

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage and threshold reports
        continue-on-error: true
        run: make coverage
      - name: verify coverage reports are tracked
        continue-on-error: true
        run: |
          git diff --exit-code \
            docs/reports/foundation/line_coverage_under_50_report.md \
            docs/reports/foundation/line_coverage_under_25_report.md \
            docs/reports/foundation/line_coverage_zero_direct_report.md
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            artifacts/coverage
            docs/reports/foundation/line_coverage_under_50_report.md
            docs/reports/foundation/line_coverage_under_25_report.md
            docs/reports/foundation/line_coverage_zero_direct_report.md
