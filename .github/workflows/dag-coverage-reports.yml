name: DAG Coverage Reports

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  coverage-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain # v1@stable
        with:
          toolchain: 1.85.0
      - name: install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage and threshold reports
        continue-on-error: true
        run: make coverage
      - name: verify coverage reports are tracked
        continue-on-error: true
        run: |
          git diff --exit-code \
            docs/reports/foundation/line_coverage_under_50_report.md \
            docs/reports/foundation/line_coverage_under_25_report.md \
            docs/reports/foundation/line_coverage_zero_direct_report.md
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            artifacts/coverage
            docs/reports/foundation/line_coverage_under_50_report.md
            docs/reports/foundation/line_coverage_under_25_report.md
            docs/reports/foundation/line_coverage_zero_direct_report.md
