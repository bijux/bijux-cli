name: DAG Package Dry Run

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: package dry run
        run: |
          for manifest in \
            crates/bijux-dag-core/Cargo.toml \
            crates/bijux-dag-artifacts/Cargo.toml \
            crates/bijux-dag-runtime/Cargo.toml \
            crates/bijux-dag-app/Cargo.toml \
            crates/bijux-dag-cli/Cargo.toml; do
            grep -q "^publish = false$" "$manifest"
          done
      - name: validate internal crate build surfaces
        run: |
          cargo check -p bijux-dag-runtime
          cargo check -p bijux-dag-app
          cargo check -p bijux-dag-cli
          cargo check -p bijux-dev
