name: DAG Package Dry Run

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-core-dev/**"
      - "configs/dag/**"
      - "makes/dag/**"
      - "docs/dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - name: package dry run
        run: |
          cargo package -p bijux-dag-core --allow-dirty --no-verify
          cargo package -p bijux-dag-artifacts --allow-dirty --no-verify
      - name: validate internal crate build surfaces
        run: |
          cargo check -p bijux-dag-runtime
          cargo check -p bijux-dag-app
          cargo check -p bijux-dag-cli
          cargo check -p bijux-core-dev
