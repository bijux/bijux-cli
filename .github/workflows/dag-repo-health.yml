name: DAG Repo Health

on:
  pull_request:
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"
  push:
    branches: [main]
    paths:
      - "crates/bijux-dag-*/**"
      - "crates/bijux-dev/**"
      - "configs/dag/**"
      - "makes/*.mk"
      - "docs/bijux-dag/**"
      - "evidence/dag/**"
      - ".github/workflows/dag-*"

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.85.0
      - name: generate hotspot reports
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- repo hotspot-reports
      - name: generate planner hardening report
        run: cargo run -p bijux-dev --bin bijux-dev-dag -- repo planner-hardening-report
      - name: verify generated hotspot reports are committed
        run: git diff --exit-code docs/reports/foundation/FILE_SIZE_HOTSPOT_REPORT.md docs/reports/foundation/LONG_FUNCTION_HOTSPOT_REPORT.md docs/reports/foundation/PUBLIC_API_HOTSPOT_REPORT.md docs/reports/foundation/dependency_cycle_report.md
      - name: verify generated planner hardening report is committed
        run: git diff --exit-code docs/reports/foundation/PLANNER_HARDENING_REPORT.md
      - name: run repo health contract tests
        run: cargo test -p bijux-dev --test file_size_guardrails
