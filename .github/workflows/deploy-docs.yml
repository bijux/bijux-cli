name: Deploy Docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    env:
      ENABLE_SOCIAL_CARDS: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            crates/bijux-cli-python/pyproject.toml
            mkdocs.yml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install documentation toolchain
        run: make gh-docs-install

      - name: Export release tag
        run: make gh-docs-export-release-tag

      - name: Generate release artifact summary pages
        run: make docs-artifact-pages

      - name: Verify release artifact summary pages
        run: make docs-artifact-pages-check

      - name: Run documentation checks
        run: make docs-check

      - name: Configure the Git author
        run: make gh-docs-configure-git

      - name: Deploy documentation
        run: make docs-deploy
