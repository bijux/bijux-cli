[pytest]
minversion = 8.0
testpaths = crates/bijux-cli-python/tests/python
pythonpath = crates/bijux-cli-python/python

norecursedirs =
  .venv
  .pytest_cache
  .ruff_cache
  build
  dist
  htmlcov
  docs
  artifacts

cache_dir = ../../artifacts/python/test/.pytest_cache

timeout = 10
timeout_method = thread
timeout_func_only = true

addopts =
  -ra
  --strict-markers
  --tb=short
  -m "not nightly"
  --cov=bijux_cli_py
  --cov-branch
  --cov-config=configs/python/coveragerc.ini
  --cov-report=term-missing:skip-covered
  --cov-report=html
  --cov-fail-under=60
xfail_strict = true

markers =
  nightly: long-running or flaky tests excluded from default runs

filterwarnings =
  ignore:jsonschema\.exceptions\.RefResolutionError is deprecated:DeprecationWarning
  ignore:.*forkpty.*:DeprecationWarning
