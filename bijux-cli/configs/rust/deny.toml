[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit explicit versions because crate
# versions are derived from release tags, so wildcard requirements are warning-level.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
