[package]
name = "bijux-dev-cli"
version.workspace = true
description = "Maintainer command surface for validating Bijux releases, documentation, ownership contracts, and quality evidence."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://bijux.github.io/bijux-cli/04-architecture/maintainer-control-plane/"
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["bijux", "maintenance", "release", "contracts", "quality"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
anyhow.workspace = true
bijux-cli.workspace = true
clap = { version = "4.5.51", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[[bin]]
name = "bijux-dev-cli"
path = "src/bin/bijux-dev-cli.rs"

[[test]]
name = "architecture_layout_contracts"
path = "tests/architecture/layout_contracts.rs"

[[test]]
name = "architecture_ownership_boundaries"
path = "tests/architecture/ownership_boundaries.rs"

[[test]]
name = "architecture_depth_limit"
path = "tests/architecture/depth_limit.rs"

[[test]]
name = "contracts_status_inventory_contracts"
path = "tests/contracts/status_inventory_contracts.rs"

[[test]]
name = "contracts_suite_catalog_contracts"
path = "tests/contracts/suite_catalog_contracts.rs"

[[test]]
name = "e2e_maintainer_routes"
path = "tests/e2e/maintainer_routes.rs"

[[test]]
name = "e2e_contract_run_all"
path = "tests/e2e/contract_run_all.rs"

[lints]
workspace = true
