site_name: Bijux CLI
site_description: A modern, predictable Python CLI framework with plugins, DI, strict flag precedence, and an interactive REPL.
site_url: !ENV [SITE_URL, https://bijux.github.io/bijux-cli/]
site_author: Bijan Mousavi
repo_url: https://github.com/bijux/bijux-cli
repo_name: bijux/bijux-cli
edit_uri: ""

strict: true
use_directory_urls: true
dev_addr: 127.0.0.1:8000
docs_dir: docs
site_dir: artifacts/docs/site

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/bijux_logo_hq.png
  favicon: assets/bijux_icon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
    - navigation.footer
  icon:
    repo: fontawesome/brands/github

plugins:
  - include-markdown:
      recursive: true
      dedent: true
      preserve_includer_indent: false
      trailing_newlines: true
      comments: false
      rewrite_relative_urls: true

  - search
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
      cache_dir: artifacts/docs/.cache/social
  - autorefs
  - redirects:
      redirect_maps:
        getting-started/installation.md: guides/installation.md
        guides/installation-unified.md: guides/installation.md
        guides/install-method-parity.md: guides/installation.md
        guides/install-channels.md: guides/installation.md
        guides/install-ci-containers.md: guides/installation.md
        guides/install-linux.md: guides/installation.md
        guides/install-macos.md: guides/installation.md
        guides/install-windows.md: guides/installation.md
        guides/uninstall-cargo.md: guides/installation.md
        guides/uninstall-pip.md: guides/installation.md
        guides/dual-install-behavior.md: guides/installation.md
        guides/upgrade-pypi-users.md: guides/installation.md
        guides/config-unified.md: guides/configuration.md
        guides/plugin-unified.md: guides/plugins.md
        guides/repl-unified.md: reference/repl.md
        reference/repl-command-reference.md: reference/repl.md
        guides/python/internal-differences.md: guides/python/runtime-migration.md
        guides/python/library-wrapper.md: guides/api-usage.md
        guides/python/packaging-maintainers.md: guides/installation.md
        guides/python/pipx-installs.md: guides/installation.md
        guides/python/plugin-delegation.md: guides/plugins.md
        guides/python/rust-engine-invocation.md: guides/python/runtime-migration.md
        guides/python/virtualenv-installs.md: guides/installation.md
        reference/current-python/top-level-commands.md: reference/current-python/index.md
        reference/current-python/dev-commands.md: reference/current-python/index.md
        reference/current-python/repl-commands-and-shortcuts.md: reference/current-python/index.md
        reference/current-python/shell-completion-behavior.md: reference/current-python/index.md
        reference/current-python/exit-codes-used-in-tests.md: reference/current-python/index.md
        architecture/config-get-post-parity-improvements.md: architecture/config-parity-report.md
        architecture/config-set-post-parity-improvements.md: architecture/config-parity-report.md
        architecture/config-parity-matrix.md: architecture/config-parity-report.md
        architecture/known-remaining-parity-gaps.md: KNOWN_GAPS.md
        architecture/rust-baseline-parity-v1.md: architecture/config-parity-report.md
        architecture/rust-config-baseline-parity-status.md: architecture/config-parity-report.md
        rust-config-parity.md: architecture/config-parity-report.md
  - tags
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - pymdownx.magiclink
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bijux/bijux-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/bijux-cli/
  analytics:
    provider: plausible
    domain: bijux.github.io
  copyright:
    text: "© 2025 Bijan Mousavi"
  release_tag: !ENV [RELEASE_TAG, "main"]

extra_css:
  - assets/styles/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

watch:
  - artifacts
  - crates
  - configs
  - templates
