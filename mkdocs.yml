site_name: Bijux CLI
site_description: A modern, predictable Python CLI framework with plugins, DI, strict flag precedence, and an interactive REPL.
site_url: !ENV [SITE_URL, https://bijux.github.io/bijux-cli/]
site_author: Bijan Mousavi
repo_url: https://github.com/bijux/bijux-cli
repo_name: bijux/bijux-cli
edit_uri: ""

strict: true
use_directory_urls: true
dev_addr: 127.0.0.1:8000
docs_dir: docs
site_dir: artifacts/docs/site

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/bijux_logo_hq.png
  favicon: assets/bijux_icon.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
    - navigation.footer
  icon:
    repo: fontawesome/brands/github

plugins:
  - include-markdown:
      recursive: true
      dedent: true
      preserve_includer_indent: false
      trailing_newlines: true
      comments: false
      rewrite_relative_urls: true

  - search
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
      cache_dir: artifacts/docs/.cache/social
  - autorefs
  - redirects:
      redirect_maps:
        getting-started/installation.md: 02-getting-started/install-and-verify.md
        guides/installation-unified.md: guides/installation.md
        guides/install-method-parity.md: guides/installation.md
        guides/install-channels.md: guides/installation.md
        guides/install-ci-containers.md: guides/installation.md
        guides/install-linux.md: guides/installation.md
        guides/install-macos.md: guides/installation.md
        guides/install-windows.md: guides/installation.md
        guides/uninstall-cargo.md: guides/installation.md
        guides/uninstall-pip.md: guides/installation.md
        guides/dual-install-behavior.md: guides/installation.md
        guides/upgrade-pypi-users.md: guides/installation.md
        guides/config-unified.md: 03-user-guide/configuration-and-output.md
        guides/plugin-unified.md: 03-user-guide/plugins-and-extensions.md
        guides/repl-unified.md: reference/repl.md
        reference/repl-command-reference.md: reference/repl.md
        guides/python/internal-differences.md: guides/python/runtime-migration.md
        guides/python/library-wrapper.md: guides/api-usage.md
        guides/python/packaging-maintainers.md: guides/installation.md
        guides/python/pipx-installs.md: guides/installation.md
        guides/python/plugin-delegation.md: 03-user-guide/plugins-and-extensions.md
        guides/cli-usage.md: 03-user-guide/everyday-commands.md
        guides/configuration.md: 03-user-guide/configuration-and-output.md
        guides/plugins.md: 03-user-guide/plugins-and-extensions.md
        guides/python/rust-engine-invocation.md: guides/python/runtime-migration.md
        guides/python/virtualenv-installs.md: guides/installation.md
        getting-started/index.md: 02-getting-started/index.md
        getting-started/quickstart.md: 02-getting-started/run-your-first-commands.md
        examples/index.md: examples/workflows.md
