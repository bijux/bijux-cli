INHERIT: mkdocs.shared.yml

site_name: Bijux Core
site_description: Unified Bijux CLI and DAG runtime workspace.
site_url: !ENV [SITE_URL, https://bijux.io/bijux-core/]
site_author: Bijan Mousavi <bijan@bijux.io>
repo_url: https://github.com/bijux/bijux-core
repo_name: bijux/bijux-core
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: artifacts/docs/site
watch:
  - docs
  - docs/assets
  - docs/overrides
  - .bijux/shared/bijux-docs
  - mkdocs.yml
  - mkdocs.shared.yml
  - docs/automation

# Only curated handbook pages are published. Specifications and reports remain
# governed repository inputs, but they are not reader-facing website pages.
exclude_docs: |
  /spec/
  /reports/
  /tracking/
  /bijux-core/**
