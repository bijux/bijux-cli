[pytest]
minversion = 8.0
testpaths = crates/bijux-cli-python/tests/python
pythonpath = crates/bijux-cli-python/python

norecursedirs =
  .venv
  .pytest_cache
  .ruff_cache
  .mypy_cache
  .hypothesis
  .benchmarks
  build
  dist
  htmlcov
  docs
  artifacts

cache_dir = artifacts/test/.pytest_cache

asyncio_mode = auto
timeout = 10
timeout_method = thread
timeout_func_only = true

addopts =
  -ra
  --strict-markers
  --tb=short
  -m "not nightly and not slow"
  --cov=bijux_cli_py
  --cov-branch
  --cov-config=configs/python/coveragerc.ini
  --cov-report=term-missing:skip-covered
  --cov-report=html
  --cov-fail-under=60
#  --hypothesis-show-statistics

xfail_strict = true

markers =
  unit: unit test
  integration: integration test
  e2e: end-to-end test
  stateful: e2e stateful sequences
  compositional: e2e compositional sequences
  precedence: e2e precedence coverage
  exit_policy: e2e exit policy coverage
  plugin: e2e plugin lifecycle coverage
  api_parity: e2e API/CLI parity coverage
  core: e2e core breaker coverage
  canary: benchmark canary guard
  nightly: long-running or flaky tests excluded from default runs
  slow: mark test as slow (deselect with '-m "not slow"')
  skip: explicitly skipped test

filterwarnings =
  ignore:Not saving anything, no benchmarks have been run!
  ignore:jsonschema\.exceptions\.RefResolutionError is deprecated:DeprecationWarning
  ignore:.*forkpty.*:DeprecationWarning
