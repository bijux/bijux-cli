[tox]
minversion                = 4.11
requires                  = tox>=4.11, tox-gh-actions>=3.1
isolated_build            = true
skip_missing_interpreters = true
envlist                   = py311, py312, py313, lint, security, build

[gh-actions]
python =
    3.11: py311, lint, security, build
    3.12: py312
    3.13: py313

[testenv]
package = skip
deps =
    -e {toxinidir}/crates/bijux-cli-python[dev]
setenv =
    PIP_DISABLE_PIP_VERSION_CHECK = 1
    PYTHONDONTWRITEBYTECODE = 1
passenv =
    CI
    GITHUB_*
    PIP_INDEX_URL
    PIP_EXTRA_INDEX_URL
    HTTP_PROXY
    HTTPS_PROXY
    NO_PROXY
    SSH_AUTH_SOCK
    LC_ALL
    LANG
commands =
    pytest -c {toxinidir}/configs/python/pytest.ini {toxinidir}/crates/bijux-cli-python/tests/python -m "not nightly and not slow" --cov=bijux_cli_py --cov-branch --cov-config={toxinidir}/configs/python/coveragerc.ini --cov-report=term-missing:skip-covered --cov-fail-under=60

[testenv:lint]
basepython = python3.11
commands =
    ruff format --check {toxinidir}/crates/bijux-cli-python/python/bijux_cli_py
    ruff check {toxinidir}/crates/bijux-cli-python/python/bijux_cli_py

[testenv:security]
basepython = python3.11
commands =
    bandit -q -ll -r {toxinidir}/crates/bijux-cli-python/python/bijux_cli_py
    pip-audit

[testenv:build]
basepython = python3.11
commands =
    python -m build --wheel --sdist --outdir {toxinidir}/artifacts/build {toxinidir}/crates/bijux-cli-python
    python -m twine check {toxinidir}/artifacts/build/*
