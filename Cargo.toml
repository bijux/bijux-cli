[workspace]
resolver = "2"
members = [
  "crates/bijux_dag_core",
  "crates/bijux_dag_artifacts",
  "crates/bijux_dag_runtime",
  "crates/bijux_dag_app",
  "crates/bijux_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Bijan Mousavi"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
sha2 = "0.10"
ctrlc = "3"
hex = "0.4"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
