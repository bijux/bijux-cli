[workspace]
members = [
    "crates/bijux-cli",
    "crates/bijux-cli-python",
    "crates/bijux-dag-core",
    "crates/bijux-dag-artifacts",
    "crates/bijux-dag-runtime",
    "crates/bijux-dag-app",
    "crates/bijux-dag-cli",
    "crates/bijux-dag-testkit",
    "crates/bijux-dev",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bijux/bijux-core"
homepage = "https://github.com/bijux/bijux-core"
documentation = "https://github.com/bijux/bijux-core"
authors = ["Bijan Mousavi <bijan@bijux.io>"]
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1.0.100"
bijux-cli = { version = "0.4.1", path = "crates/bijux-cli" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
croner = "3.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
serde_yaml = "0.9.34"
toml = "1.1.2"
thiserror = "2.0.17"
tempfile = "3.23.0"
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = "4.6.5"
sha2 = "0.10.9"
ctrlc = "3.5.1"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.4"
base64 = "0.23.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
nix = { version = "0.31.2", features = ["process", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
match_same_arms = "allow"
redundant_closure_for_method_calls = "allow"
needless_pass_by_value = "allow"
match_like_matches_macro = "allow"
if_not_else = "allow"
unusual_byte_groupings = "allow"
needless_borrow = "allow"
manual_string_new = "allow"
ptr_arg = "allow"
unnested_or_patterns = "allow"
semicolon_if_nothing_returned = "allow"
map_unwrap_or = "allow"
if_same_then_else = "allow"
uninlined_format_args = "allow"
format_push_string = "allow"
unused_self = "allow"
result_large_err = "allow"
single_match_else = "allow"
manual_let_else = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
collapsible_if = "allow"
single_char_pattern = "allow"
many_single_char_names = "allow"
useless_vec = "allow"
cast_possible_wrap = "allow"
implicit_clone = "allow"
type_complexity = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
cast_precision_loss = "allow"
needless_raw_string_hashes = "allow"
let_and_return = "allow"
default_trait_access = "allow"
single_match = "allow"
match_wildcard_for_single_variants = "allow"
unnecessary_wraps = "allow"
inefficient_to_string = "allow"
enum_variant_names = "allow"
new_without_default = "allow"
needless_return = "allow"
field_reassign_with_default = "allow"
vec_init_then_push = "allow"
redundant_else = "allow"
collapsible_else_if = "allow"
ref_option = "allow"
bool_to_int_with_if = "allow"
wildcard_imports = "allow"
float_cmp = "allow"
bool_assert_comparison = "allow"
unnecessary_get_then_check = "allow"
ignored_unit_patterns = "allow"
no_effect_underscore_binding = "allow"
filter_map_next = "allow"
unchecked_duration_subtraction = "allow"
manual_assert = "allow"
redundant_closure = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_map_or = "allow"
iter_cloned_collect = "allow"
single_char_add_str = "allow"
too_many_arguments = "allow"
struct_field_names = "allow"
single_element_loop = "allow"
const_is_empty = "allow"
items_after_test_module = "allow"
